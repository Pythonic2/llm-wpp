services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pi_default

  backend:
    image: "ghcr.io/pythonic2/llm-wpp:${APP_IMAGE_TAG:?Defina APP_IMAGE_TAG no Portainer (ex.: sha-abc123...)}"
    pull_policy: always
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:?Defina DB_NAME no Portainer}
      DB_USER: ${DB_USER:?Defina DB_USER no Portainer}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Portainer}
      DB_HOST: ${DB_HOST:?Defina DB_HOST no Portainer}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-crm}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_CHANNEL_BINDING: ${DB_CHANNEL_BINDING:-require}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no Portainer}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS no Portainer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Defina CSRF_TRUSTED_ORIGINS no Portainer}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:?Defina GEMINI_CHAT_MODEL no Portainer}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-200}
      GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS: ${GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS:-800}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      GEMINI_HISTORY_MAX_MESSAGES: ${GEMINI_HISTORY_MAX_MESSAGES:-8}
      GEMINI_RAG_TOP_K: ${GEMINI_RAG_TOP_K:-3}
      GEMINI_RAG_CHUNK_MAX_CHARS: ${GEMINI_RAG_CHUNK_MAX_CHARS:-1200}
      GEMINI_INPUT_COST_PER_MILLION: ${GEMINI_INPUT_COST_PER_MILLION:-0}
      GEMINI_OUTPUT_COST_PER_MILLION: ${GEMINI_OUTPUT_COST_PER_MILLION:-0}
      GEMINI_THINKING_COST_PER_MILLION: ${GEMINI_THINKING_COST_PER_MILLION:-0}
      GEMINI_AUDIO_MODEL: ${GEMINI_AUDIO_MODEL:-}
      GEMINI_AUDIO_MAX_OUTPUT_TOKENS: ${GEMINI_AUDIO_MAX_OUTPUT_TOKENS:-1000}
      WHATSAPP_AUDIO_MAX_BYTES: ${WHATSAPP_AUDIO_MAX_BYTES:-20971520}
      MEDIA_LIBRARY_MAX_BYTES: ${MEDIA_LIBRARY_MAX_BYTES:-16777216}
      MEDIA_SEARCH_TOP_K: ${MEDIA_SEARCH_TOP_K:-5}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SIGNED_URL_EXPIRATION: ${GCS_SIGNED_URL_EXPIRATION:-300}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v26.0}
    ports:
      - "8123:8123"
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pi_default

  worker:
    image: "ghcr.io/pythonic2/llm-wpp:${APP_IMAGE_TAG:?Defina APP_IMAGE_TAG no Portainer (ex.: sha-abc123...)}"
    pull_policy: always
    command: .venv/bin/celery -A gesttech worker -l info
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:?Defina DB_NAME no Portainer}
      DB_USER: ${DB_USER:?Defina DB_USER no Portainer}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no Portainer}
      DB_HOST: ${DB_HOST:?Defina DB_HOST no Portainer}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-crm}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_CHANNEL_BINDING: ${DB_CHANNEL_BINDING:-require}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no Portainer}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina DJANGO_ALLOWED_HOSTS no Portainer}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Defina CSRF_TRUSTED_ORIGINS no Portainer}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      CSRF_COOKIE_SAMESITE: ${CSRF_COOKIE_SAMESITE:-Lax}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:?Defina GEMINI_CHAT_MODEL no Portainer}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-200}
      GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS: ${GEMINI_ANALYSIS_MAX_OUTPUT_TOKENS:-800}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      GEMINI_HISTORY_MAX_MESSAGES: ${GEMINI_HISTORY_MAX_MESSAGES:-8}
      GEMINI_RAG_TOP_K: ${GEMINI_RAG_TOP_K:-3}
      GEMINI_RAG_CHUNK_MAX_CHARS: ${GEMINI_RAG_CHUNK_MAX_CHARS:-1200}
      GEMINI_INPUT_COST_PER_MILLION: ${GEMINI_INPUT_COST_PER_MILLION:-0}
      GEMINI_OUTPUT_COST_PER_MILLION: ${GEMINI_OUTPUT_COST_PER_MILLION:-0}
      GEMINI_THINKING_COST_PER_MILLION: ${GEMINI_THINKING_COST_PER_MILLION:-0}
      GEMINI_AUDIO_MODEL: ${GEMINI_AUDIO_MODEL:-}
      GEMINI_AUDIO_MAX_OUTPUT_TOKENS: ${GEMINI_AUDIO_MAX_OUTPUT_TOKENS:-1000}
      WHATSAPP_AUDIO_MAX_BYTES: ${WHATSAPP_AUDIO_MAX_BYTES:-20971520}
      MEDIA_LIBRARY_MAX_BYTES: ${MEDIA_LIBRARY_MAX_BYTES:-16777216}
      MEDIA_SEARCH_TOP_K: ${MEDIA_SEARCH_TOP_K:-5}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SIGNED_URL_EXPIRATION: ${GCS_SIGNED_URL_EXPIRATION:-300}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v26.0}
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pi_default
volumes:
  media_data:
networks:
  pi_default:
    external: true
