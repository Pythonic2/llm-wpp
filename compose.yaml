services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pi_default

  backend:
    build: .
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:?Defina DB_NAME}
      DB_USER: ${DB_USER:?Defina DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      DB_HOST: ${DB_HOST:?Defina DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-crm}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_CHANNEL_BINDING: ${DB_CHANNEL_BINDING:-require}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      CELERY_BROKER_URL: redis://redis:6379/0
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8123}
    ports:
      - "8123:8123"
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pi_default

  worker:
    build: .
    command: .venv/bin/celery -A gesttech worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:?Defina DB_NAME}
      DB_USER: ${DB_USER:?Defina DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      DB_HOST: ${DB_HOST:?Defina DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-crm}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_CHANNEL_BINDING: ${DB_CHANNEL_BINDING:-require}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pi_default

  frontend:
    build:
      context: ../frontend-llm-wpp
    environment:
      VITE_API_BASE_URL: http://localhost:8123/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-llm-wpp:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - pi_default

volumes:
  media_data:
  frontend_node_modules:

networks:
  pi_default:
    external: true
